# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# dependabot-automerge.yml — enable GitHub's native auto-merge on verified
# Dependabot pull requests, following this repository's existing owner policy:
# patch, minor and major updates, both security and routine.
#
# What this does:
#   - Triggers on every Dependabot PR.
#   - Reads the PR's update-type metadata via the dependabot/fetch-metadata
#     action (no free-text parsing).
#   - Queues a merge of the event's exact head commit; GitHub enforces the
#     target branch's configured required checks and reviews.
#   - Does not submit an approving review. Auto-merge can be enabled while a
#     required review is pending; that review remains a maintainer's decision.
#
# Why auto-merge on GitHub (not via a bot like rhodibot) is the right
# layer: GitHub enforces branch protection + required checks natively,
# and the PR author is already `dependabot[bot]`. Rhodibot doesn't need
# to know anything about ecosystems — GitHub handles the merge mechanics
# once those requirements are met. No approval permission or ruleset bypass
# is needed, and the workflow never uses --admin. Checks must be configured
# as required on the target branch if they are intended to block a merge.
#
# Dogfooding: this workflow template is itself subject to the same
# Dependabot config via the github-actions ecosystem block, so SHA
# bumps for dependabot/fetch-metadata flow through the same path.

name: Dependabot Auto-Merge
on:
  pull_request:
    types: [opened, reopened, synchronize]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
  # NB: keep narrow — do NOT add secrets: read or id-token: write here.
  # The write scope auto-merge needs is elevated PER JOB below, not here: a
  # job-level permissions: block REPLACES this one, so the job restates both.
jobs:
  automerge:
    # Check the immutable author ID as well as the login and event actor.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.id == 49699333 &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write # needed to enable auto-merge (gh pr merge --auto)
      pull-requests: write # needed to enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Metadata must pass fetch-metadata's verification before queuing a merge.
      - name: Decide policy outcome
        id: policy
        env:
          GHSA_ID: ${{ steps.meta.outputs.ghsa-id }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          set -euo pipefail

          is_security=false
          [ -n "$GHSA_ID" ] && is_security=true

          # Preserve the owner's existing all-updates policy. Auto-merge waits
          # for the branch's required checks and reviews; it does not approve
          # the PR or bypass any of those requirements.
          echo "action=automerge" >> "$GITHUB_OUTPUT"
          echo "security=$is_security" >> "$GITHUB_OUTPUT"
          echo "update_type=$UPDATE_TYPE" >> "$GITHUB_OUTPUT"
          echo "ghsa=$GHSA_ID" >> "$GITHUB_OUTPUT"
      - name: Enable auto-merge (if policy allows)
        id: enable
        if: steps.policy.outputs.action == 'automerge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
      - name: Write decision to step summary
        if: always()
        env:
          ACTION: ${{ steps.policy.outputs.action }}
          MERGE_OUTCOME: ${{ steps.enable.outcome }}
          IS_SECURITY: ${{ steps.policy.outputs.security }}
          UPDATE_TYPE: ${{ steps.policy.outputs.update_type }}
          GHSA: ${{ steps.policy.outputs.ghsa }}
        run: |
          {
            echo "## Dependabot Auto-Merge Decision"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Policy action | \`$ACTION\` |"
            echo "| Auto-merge request | \`$MERGE_OUTCOME\` |"
            echo "| Security update | \`$IS_SECURITY\` |"
            echo "| Update type | \`$UPDATE_TYPE\` |"
            echo "| GHSA ID | \`${GHSA:-n/a}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
