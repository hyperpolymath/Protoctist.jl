# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Governance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read      # required by the reusable workflow (staleness check reads workflow runs)
  contents: read

jobs:
  governance:
    uses: metadatastician/standards/.github/workflows/governance-reusable.yml@8d1a2aab4211493cf42f147f2080f024605797dc
    with:
      # Preserve the previously reviewed scanner if a baseline is added later.
      hypatia-ref: 51ab6496bf47e30a0576d503df31fec30f3cfe56

  # The transfer-aware reusable no longer ratchets root-allow.txt because
  # standards itself retired that ledger. Protoctist still carries it, so
  # retain the previously reviewed checker alongside the new shared gates.
  root-allowlist-ratchet:
    name: Root allowlist ratchet
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout caller history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout reviewed exemption checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: metadatastician/standards
          ref: cf8f91219d80da55cf8cbbfcd587d00c2d8798ed
          path: .standards-root-ratchet
          sparse-checkout: |
            scripts/check-exemption-ratchet.sh
            scripts/count-ledger-entries.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Preserve root allowlist growth checks
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/root-allow-ratchet"
          cp .standards-root-ratchet/scripts/check-exemption-ratchet.sh \
             .standards-root-ratchet/scripts/count-ledger-entries.sh \
             "$RUNNER_TEMP/root-allow-ratchet/"
          rm -rf .standards-root-ratchet
          bash "$RUNNER_TEMP/root-allow-ratchet/check-exemption-ratchet.sh" "$BASE_REF"
